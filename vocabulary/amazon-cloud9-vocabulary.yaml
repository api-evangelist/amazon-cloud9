vocabulary: "1.0.0"

info:
  provider: "Amazon Cloud9"
  description: "Vocabulary for Amazon Cloud9 APIs covering operations, schemas, and capability workflows."
  created: "2026-04-19"
  modified: "2026-04-19"

operational:
  apis:
    - name: "Amazon Cloud9 API"
      namespace: cloud9
      baseUrl: https://cloud9.us-east-1.amazonaws.com
      status: active

  resources: []
  actions:
    - name: list
      httpMethod: GET
      pattern: read
    - name: create
      httpMethod: POST
      pattern: write
    - name: get
      httpMethod: GET
      pattern: read
    - name: delete
      httpMethod: DELETE
      pattern: destructive

  authentication:
    schemes:
      - type: AWS Signature Version 4
        apis: [cloud9]

capability:
  workflows:
    - name: "Development Environment Management"
      file: capabilities/development-environment.yaml
      toolCount: 5
      personas: [Software Developer]

  personas:
    - id: software-developer
      name: "Software Developer"
      workflows: ["Development Environment Management"]

  namespaces:
    - name: cloud9
      type: consumed
      baseUri: https://cloud9.us-east-1.amazonaws.com
    - name: cloud9-workflow-api
      type: rest-exposed
      port: 8080
    - name: cloud9-workflow-mcp
      type: mcp-exposed
      port: 9090

  binds:
    - name: AWS_ACCESS_KEY_ID
      workflows: ["Development Environment Management"]
    - name: AWS_SECRET_ACCESS_KEY
      workflows: ["Development Environment Management"]

crossReference: []
