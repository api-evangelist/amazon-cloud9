aid: amazon-cloud9
name: Amazon Cloud9
description: >-
  AWS Cloud9 is a browser-based integrated development environment (IDE) that enables developers to write, run, and debug code without installing local software. Supports 40+ programming languages with
  real-time collaboration, integrated terminal, and pre-authenticated AWS CLI.
