naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Cloud9 Development Environment Management"
  description: "Workflow for development environment management using Amazon Cloud9 for Software Developer personas."
  tags:
    - Amazon Web Services
    - Amazon Cloud9
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: cloud9
      location: ./shared/cloud9.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: cloud9-workflow-api
      description: "Unified REST API for Amazon Cloud9 development environment management."
      resources: []

    - type: mcp
      port: 9090
      namespace: cloud9-workflow-mcp
      transport: http
      description: "MCP server for AI-assisted Amazon Cloud9 development environment management."
      tools: []
