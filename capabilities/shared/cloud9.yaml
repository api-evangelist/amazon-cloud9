naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Cloud9"
  description: "API for creating and managing Cloud9 development environments — browser-based IDEs running on EC2 instances or SSH-connected servers."
  tags:
    - Amazon Web Services
    - Amazon Cloud9
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: cloud9
      baseUri: https://cloud9.us-east-1.amazonaws.com
      description: "Amazon Cloud9 API."
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources: []

  exposes:
    - type: rest
      port: 8100
      namespace: cloud9-rest
      resources: []

    - type: mcp
      port: 9100
      namespace: cloud9-mcp
      transport: http
      tools: []
